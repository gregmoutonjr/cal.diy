# Fresh, separate test installation. Do not attach an existing database volume.
# Keep this file at the root of your Cal.diy fork; build context is that checkout.
# Set the required secrets in Dockhand's stack environment variables.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_HOST: database:5432
  DATABASE_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
  DATABASE_DIRECT_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
  DATABASE_READ_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
  DATABASE_WRITE_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
  CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?Set CALENDSO_ENCRYPTION_KEY}
  NEXT_PUBLIC_WEBAPP_URL: ${WEB_URL:-http://192.168.0.32:3100}
  NEXTAUTH_URL: ${WEB_URL:-http://192.168.0.32:3100}/api/auth
  WEB_APP_URL: ${WEB_URL:-http://192.168.0.32:3100}
  NEXT_PUBLIC_API_V2_URL: ${API_PUBLIC_URL:-http://192.168.0.32:3101}/v2
  REDIS_URL: redis://redis:6379
  CALCOM_TELEMETRY_DISABLED: "1"
  ORGANIZATIONS_ENABLED: "false"
  NEXT_PUBLIC_SINGLE_ORG_SLUG: ""
  CSP_POLICY: non-strict

services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: caldiy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: calendso
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caldiy -d calendso"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  calcom:
    image: caldiy-test-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${WEB_URL:-http://192.168.0.32:3100}
        NEXT_PUBLIC_API_V2_URL: ${API_PUBLIC_URL:-http://192.168.0.32:3101}/v2
        NEXT_PUBLIC_LICENSE_CONSENT: ""
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL:-}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL:-}
        NEXT_PUBLIC_SINGLE_ORG_SLUG: ""
        ORGANIZATIONS_ENABLED: "false"
        CALCOM_TELEMETRY_DISABLED: "1"
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?Set CALENDSO_ENCRYPTION_KEY}
        DATABASE_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
        DATABASE_DIRECT_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
        CSP_POLICY: non-strict
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      <<: *app-env
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  calcom-api:
    image: caldiy-test-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
        DATABASE_DIRECT_URL: postgresql://caldiy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/calendso
    restart: unless-stopped
    ports:
      - "3101:5555"
    environment:
      <<: *app-env
      API_PORT: "5555"
      API_URL: ${API_PUBLIC_URL:-http://192.168.0.32:3101}
      API_KEY_PREFIX: cal_
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CALCOM_SERVICE_ACCOUNT_ENCRYPTION_KEY: ${CALCOM_SERVICE_ACCOUNT_ENCRYPTION_KEY:?Set CALCOM_SERVICE_ACCOUNT_ENCRYPTION_KEY}
      LOG_LEVEL: info
      IS_E2E: "false"
      REWRITE_API_V2_PREFIX: "1"
      IS_TEAM_BILLING_ENABLED: "false"
      ENABLE_ASYNC_TASKER: "false"
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      calcom:
        condition: service_healthy

volumes:
  database-data:
  redis-data:
